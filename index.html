<script>
const URL_SUPABASE = "https://nkothmxdwpkptuvzunkb.supabase.co";
const KEY_SUPABASE = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5rb3RobXhkd3BrcHR1dnp1bmtiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA4OTI2NDMsImV4cCI6MjEwNjQ2ODY0M30.h1_TsMUsoiG45RWrZ5t7gY3r-KgGV230czfj0yM-GAY";
const { createClient } = supabase;
const sb = createClient(URL_SUPABASE, KEY_SUPABASE);

let NAMA_PER_ROLE = {
  guru: [
    { nama: "Elma Noor Safitri, S.Pd.", email: "elmamazkira@gmail.com" },
    { nama: "Jamsiah", email: "yayahmazkira@gmail.com" },
    { nama: "Nurul Fatimah, S.Pd.", email: "imahmazkira@gmail.com" },
    { nama: "Nadila Ramadhan P.S.", email: "nadilamazkira@gmail.com" },
    { nama: "Halimatus Sa'diah, S.Pd.", email: "diahmazkira@gmail.com" }
  ],
  tendik: [{ nama: "Puspa Erma Sari", email: "puspamazkira@gmail.com" }],
  kepala: [{ nama: "Sugianto, S.Pd., Gr.", email: "sugianto.spd.2021@gmail.com" }],
  admin: [{ nama: "Anto", email: "boss.antobjm@gmail.com" }]
};

const ROLE_GLOW = {
  guru  : { main:'#4ADE80', soft:'rgba(74,222,128,.40)' },
  tendik: { main:'#D97706', soft:'rgba(217,119,6,.40)' },
  kepala: { main:'#3B82F6', soft:'rgba(59,130,246,.40)' },
  admin : { main:'#EF4444', soft:'rgba(239,68,68,.40)' }
};

function applyRoleGlow(role){
  const cfg = ROLE_GLOW[role] || ROLE_GLOW.guru;
  document.documentElement.style.setProperty('--role-glow', cfg.main);
  document.documentElement.style.setProperty('--role-glow-soft', cfg.soft);
}

function updateNamaDropdown(){
  const role = document.getElementById('role').value;
  const namaSelect = document.getElementById('nama');
  namaSelect.innerHTML = '';
  const daftarNama = NAMA_PER_ROLE[role] || [];

  if(daftarNama.length === 0){
    const opt = document.createElement('option');
    opt.value = ''; opt.textContent = '— Tidak ada data —'; opt.disabled = true;
    namaSelect.appendChild(opt);
  } else {
    daftarNama.forEach(item => {
      const opt = document.createElement('option');
      opt.value = item.nama;
      opt.setAttribute('data-email', item.email);
      opt.textContent = item.nama;
      namaSelect.appendChild(opt);
    });
  }
  applyRoleGlow(role);
  updateEmailField();
}

function updateEmailField(){
  const select = document.getElementById('nama');
  const selectedOption = select.options[select.selectedIndex];
  const email = selectedOption ? selectedOption.getAttribute('data-email') : '';
  document.getElementById('email').value = email || '';
}

function togglePassword(e){
  if(e && e.preventDefault) e.preventDefault();
  const input = document.getElementById('password');
  const btn = (e && e.currentTarget) ? e.currentTarget : document.querySelector('.toggle-password');
  if(input.type === 'password'){ input.type = 'text'; if(btn) btn.textContent = '🙈'; } 
  else { input.type = 'password'; if(btn) btn.textContent = '👁️'; }
}

// Tambahkan fungsi beep baru ini di atas fungsi login
function playErrorBeep(){
  try{
    const Ctx = window.AudioContext || window.webkitAudioContext;
    if(!Ctx) return;
    const ctx = new Ctx();
    
    // Fungsi pembuat nada
    const beep = (startAt, freq, dur) => {
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      
      osc.type = 'sine'; // Gelombang sinus = suara bersih & nyaring (bel)
      osc.frequency.setValueAtTime(freq, ctx.currentTime + startAt);
      
      // Volume lebih keras (1.0 = maksimal)
      gain.gain.setValueAtTime(0.0001, ctx.currentTime + startAt);
      gain.gain.exponentialRampToValueAtTime(1.0, ctx.currentTime + startAt + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + startAt + dur);
      
      osc.connect(gain).connect(ctx.destination);
      osc.start(ctx.currentTime + startAt);
      osc.stop(ctx.currentTime + startAt + dur + 0.02);
    };
    
    // Nada "TING" (Frekuensi tinggi: 880 Hz / A5)
    beep(0.00, 880, 0.4); 
    
    // Nada "TONG" (Frekuensi lebih rendah: 659 Hz / E5)
    beep(0.4, 659, 0.6); 
    
    // Bersihkan audio setelah selesai
    setTimeout(() => { try{ ctx.close(); }catch(e){} }, 1200);
  }catch(e){}
}

async function login(){
  const nama = document.getElementById('nama').value.trim();
  const email = document.getElementById('email').value;
  const password = document.getElementById('password').value;

  if(!nama || !email){ playErrorBeep(); alert('Pilih nama terlebih dahulu!'); return; }
  if(!password){ playErrorBeep(); alert('Password wajib diisi!'); return; }

  const btn = document.getElementById('btnLogin');
  btn.textContent = '⏳ Memeriksa...';
  btn.disabled = true;

  try {
    const { data: authData, error: authError } = await sb.auth.signInWithPassword({ email, password });
    if (authError) throw new Error(authError.message);

    const { data: profile } = await sb.from('profiles').select('role, nama_lengkap').eq('id', authData.user.id).single();
    const finalRole = profile ? profile.role : document.getElementById('role').value;
    const finalName = profile ? profile.nama_lengkap : nama;

    localStorage.setItem('user', JSON.stringify({
      id: authData.user.id, email: authData.user.email, nama: finalName, role: finalRole, loginAt: new Date().toISOString()
    }));

    if(finalRole === 'admin')       window.location.href = 'admin.html';
    else if(finalRole === 'guru')   window.location.href = 'guru.html';
    else if(finalRole === 'kepala') window.location.href = 'kepsek.html';
    else if(finalRole === 'tendik') window.location.href = 'tendik.html';

  } catch (err) {
    // ✅ SUARA BEEP DITAMBAHKAN DI SINI
    playErrorBeep();
    
    alert('Login gagal: ' + err.message);
    document.getElementById('password').value = '';
    btn.disabled = false;
    btn.textContent = 'Masuk →';
  }
}

function cekLogo(){
  const img = new Image();
  img.onload = () => { document.getElementById('logoBox').innerHTML = '<img src="logo-mazkira-200x200px.png" alt="Logo">'; };
  img.src = 'logo-mazkira-200x200px.png';
}

function updateClock(){
  const now = new Date(); const utc = now.getTime() + (now.getTimezoneOffset() * 60000); const wita = new Date(utc + (8 * 3600000));
  const days = ['Minggu','Senin','Selasa','Rabu','Kamis','Jumat','Sabtu']; const months = ['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
  const h = String(wita.getHours()).padStart(2,'0'); const m = String(wita.getMinutes()).padStart(2,'0');
  const el = document.getElementById('liveClock');
  if(el) el.textContent = days[wita.getDay()] + ', ' + wita.getDate() + ' ' + months[wita.getMonth()] + ' ' + wita.getFullYear() + ' • ' + h + '.' + m + ' WITA';
}

function applyTheme(){
  const theme = localStorage.getItem('theme') || 'dark';
  document.body.classList.toggle('light', theme === 'light');
  const btn = document.getElementById('themeBtn');
  if (btn) btn.textContent = theme === 'light' ? '🌙' : '☀️';
}
function toggleTheme(){
  const current = localStorage.getItem('theme') || 'dark';
  localStorage.setItem('theme', current === 'dark' ? 'light' : 'dark');
  applyTheme();
}

function init(){
  applyTheme(); updateClock(); setInterval(updateClock, 1000); cekLogo();
  updateNamaDropdown();
  document.addEventListener('keydown', (e) => { if(e.key === 'Enter' && e.target.tagName !== 'SELECT'){ login(); } });
}
init();
</script>
