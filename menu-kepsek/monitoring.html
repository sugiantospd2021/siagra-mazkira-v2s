<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<link rel="icon" type="image/png" href="logo-siagra.png">
<title>SIAGRA - Absensi Guru</title>
<meta name="description" content="Form Absensi Guru — SIAGRA">
<meta name="theme-color" content="#1E3A8A">
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="SIAGRA">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<!-- ✨ TAMBAHAN SUPABASE ✨ -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../supabase-config.js"></script>

<style>
  *{margin:0;padding:0;box-sizing:border-box}
  :root{
    --bg:#0A0A0A; --card:#0F1A3A; --card-inner:#0A0F26;
    --text:#F1F5F9; --sub:#94A3B8; --border:#1E3A8A;
    --primary:#3B82F6; --primary-dark:#1E40AF; --primary-light:#1E3A8A;
    --accent:#60A5FA; --success:#4ADE80; --danger:#F87171;
    --yellow:#FCD34D;
    --absen-hadir:#34D399; --absen-sakit:#FBBF24;
    --absen-izin:#60A5FA; --absen-cuti:#A78BFA; --absen-alpa:#F87171;

    --role-primary:#3B82F6;
    --role-primary-dark:#1E40AF;
    --role-accent:#60A5FA;
    --role-glow:rgba(59,130,246,.5);
    --role-header-grad:linear-gradient(135deg,#1E3A8A,#1E40AF);
    --role-header-border:#3B82F6;
    --role-header-text:#FCD34D;
    --role-intro-grad:linear-gradient(135deg,#1E3A8A,#2563EB 60%,#60A5FA);
    --role-bg-radial:
      radial-gradient(circle at 10% 10%, rgba(30,58,138,.25) 0%, transparent 40%),
      radial-gradient(circle at 90% 20%, rgba(59,130,246,.15) 0%, transparent 40%),
      radial-gradient(circle at 50% 90%, rgba(30,64,175,.12) 0%, transparent 40%);
    --role-card:#0F1A3A;
    --role-card-inner:#0A0F26;
    --role-border:#1E3A8A;
  }
  body.light{
    --bg:#F0F4FF; --card:#FFFFFF; --card-inner:#F8FAFF;
    --text:#1E293B; --sub:#64748B; --border:#BFDBFE;
    --primary:#3B82F6; --primary-dark:#1E40AF; --primary-light:#DBEAFE;
    --accent:#2563EB; --success:#059669; --danger:#DC2626;
    --yellow:#D97706;
    --absen-hadir:#10B981; --absen-sakit:#F59E0B;
    --absen-izin:#3B82F6; --absen-cuti:#8B5CF6; --absen-alpa:#EF4444;

    --role-primary:#3B82F6;
    --role-primary-dark:#1E40AF;
    --role-accent:#60A5FA;
    --role-glow:rgba(59,130,246,.5);
    --role-header-grad:linear-gradient(135deg,#1E3A8A,#1E40AF);
    --role-header-border:#3B82F6;
    --role-header-text:#FCD34D;
    --role-intro-grad:linear-gradient(135deg,#1E3A8A,#2563EB 60%,#60A5FA);
    --role-bg-radial:
      radial-gradient(circle at 10% 10%, rgba(191,219,254,.4) 0%, transparent 40%),
      radial-gradient(circle at 90% 20%, rgba(147,197,253,.3) 0%, transparent 40%),
      radial-gradient(circle at 50% 90%, rgba(96,165,250,.2) 0%, transparent 40%);
    --role-card:#FFFFFF;
    --role-card-inner:#F8FAFF;
    --role-border:#BFDBFE;
  }
  body{
    font-family:'Plus Jakarta Sans','Inter',-apple-system,sans-serif;
    background:var(--bg);
    background-image:var(--role-bg-radial);
    background-attachment:fixed;min-height:100vh;color:var(--text);
    transition:background .3s,color .3s;
    position:relative;overflow-x:hidden;
    font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;
  }

  /* Ornamen disederhanakan untuk menghemat tempat, Anda bisa copy dari file asli */
  .ornament{position:fixed;pointer-events:none;z-index:0;opacity:.35;animation:float 6s ease-in-out infinite}
  @keyframes float{0%,100%{transform:translateY(0) rotate(0deg)}50%{transform:translateY(-18px) rotate(10deg)}}

  .header{
    position:sticky;top:0;z-index:100;
    background:var(--role-header-grad);
    color:#fff;padding:14px 24px;
    display:flex;justify-content:space-between;align-items:center;
    box-shadow:0 4px 16px rgba(30,58,138,.5);
    border-bottom:2px solid var(--role-header-border);gap:12px;
    transition:background .3s,border-color .3s;
  }
  .header-left{flex:0 1 auto;min-width:0;display:flex;align-items:center;gap:10px}
  .header-left h1{font-size:17px;color:var(--role-header-text);letter-spacing:.02em;font-weight:800;white-space:nowrap}
  .header-center{flex:1 1 auto;display:flex;justify-content:center;min-width:0}
  .jam-box{
    display:inline-flex;align-items:center;gap:8px;
    background:rgba(255,255,255,.15);
    border:1.5px solid rgba(96,165,250,.5);
    color:#F1F5F9;padding:8px 18px;border-radius:100px;
    font-size:12.5px;font-weight:700;white-space:nowrap;
    backdrop-filter:blur(10px);
  }
  .jam-dot{
    width:8px;height:8px;border-radius:50%;background:#FCD34D;
    box-shadow:0 0 0 3px rgba(252,211,77,.4);
    animation:pulse 2s ease-in-out infinite;flex-shrink:0;
  }
  @keyframes pulse{0%,100%{box-shadow:0 0 0 3px rgba(252,211,77,.4)}50%{box-shadow:0 0 0 6px rgba(252,211,77,.1)}}
  .header-right{flex:0 0 auto;display:flex;gap:8px;align-items:center}
  .theme-toggle{
    background:rgba(255,255,255,.18);border:none;color:#fff;
    width:38px;height:38px;border-radius:50%;
    font-size:17px;cursor:pointer;transition:transform .2s;
    display:flex;align-items:center;justify-content:center;
  }
  .theme-toggle:hover{transform:scale(1.1) rotate(15deg);background:rgba(255,255,255,.3)}
  .header-right button.logout{
    background:linear-gradient(135deg,#DC2626,#991B1B);
    color:#fff;border:none;
    padding:8px 16px;border-radius:8px;cursor:pointer;
    font-family:inherit;font-weight:700;transition:all .2s;
    font-size:13px;box-shadow:0 2px 8px rgba(220,38,38,.4);
  }
  .header-right button.logout:hover{
    background:linear-gradient(135deg,#EF4444,#B91C1C);
    transform:translateY(-1px);
  }

  .wrapper{
    max-width:1280px;margin:0 auto;padding:24px 16px;
    display:grid;grid-template-columns:300px 1fr;gap:24px;
    position:relative;z-index:1;align-items:start;
  }

  /* Profil Card */
  .col-profil{
    position:sticky;top:88px;
    height:calc(100vh - 110px);max-height:calc(100vh - 110px);
  }
  .profile-card{
    background:var(--card);border-radius:16px;
    border:2px solid var(--border);
    box-shadow:0 0 0 1px rgba(96,165,250,.2),0 0 25px rgba(59,130,246,.25),0 8px 24px rgba(0,0,0,.6);
    border-top:4px solid var(--accent);
    height:100%;max-height:100%;
    display:flex;flex-direction:column;overflow:hidden;
    transition:background .3s;
  }
  .profile-card-header{
    padding:20px 18px 16px;text-align:center;
    border-bottom:1px dashed rgba(96,165,250,.25);
    flex-shrink:0;background:rgba(30,58,138,.35);
    transition:background .3s;
  }
  body.light .profile-card-header{background:rgba(219,234,254,.5)}
  .profile-photo{
    width:80px;height:80px;border-radius:50%;
    background:linear-gradient(135deg,#1E3A8A,#3B82F6);
    display:flex;align-items:center;justify-content:center;
    font-size:32px;font-weight:800;color:#F1F5F9;
    overflow:hidden;flex-shrink:0;
    border:3px solid var(--accent);
    box-shadow:0 4px 14px rgba(59,130,246,.4);
    margin:0 auto 12px;
  }
  .profile-photo img{width:100%;height:100%;object-fit:cover}
  .profile-photo svg{width:100%;height:100%;display:block}
  .profile-card-header h2{
    font-size:14.5px;font-weight:800;
    color:var(--text);margin-bottom:6px;line-height:1.35;
  }
  .profile-card-header .jabatan-badge{
    display:inline-block;padding:4px 12px;border-radius:100px;
    font-size:10.5px;font-weight:700;
    background:rgba(96,165,250,.25);color:#93C5FD;
    text-transform:uppercase;letter-spacing:.03em;margin-bottom:6px;
  }
  body.light .profile-card-header .jabatan-badge{
    background:rgba(37,99,235,.15);color:#1E40AF;
  }
  .profile-card-header .lama-text{
    display:block;font-size:11.5px;font-weight:700;
    color:var(--yellow);margin-top:4px;
  }
  .profile-card-body{
    flex:1;overflow-y:auto;padding:14px 18px 18px;
    scrollbar-width:thin;scrollbar-color:rgba(96,165,250,.4) transparent;
  }
  .profile-card-body::-webkit-scrollbar{width:6px}
  .profile-card-body::-webkit-scrollbar-thumb{
    background:rgba(96,165,250,.4);border-radius:10px;
  }
  .info-section-title{
    font-size:10px;font-weight:800;color:#93C5FD;
    text-transform:uppercase;letter-spacing:.06em;
    margin-bottom:8px;margin-top:6px;
    display:flex;align-items:center;gap:6px;
  }
  body.light .info-section-title{color:#1E40AF}
  .info-section-title::before{
    content:'';width:3px;height:12px;
    background:var(--accent);border-radius:2px;
  }
  .info-list{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
  .info-item{
    display:flex;justify-content:space-between;gap:8px;
    padding:7px 10px;background:var(--card-inner);
    border:1px solid rgba(96,165,250,.15);
    border-radius:8px;font-size:11.5px;line-height:1.4;
    transition:background .2s;
  }
  body.light .info-item{ border:1px solid rgba(37,99,235,.15); }
  .info-item:hover{background:rgba(30,58,138,.6);border-color:rgba(96,165,250,.4)}
  body.light .info-item:hover{ background:rgba(219,234,254,.6); }
  .info-item .lbl{color:#93C5FD;font-weight:600;flex-shrink:0}
  body.light .info-item .lbl{color:#1E40AF}
  .info-item .val{
    color:var(--text);font-weight:700;
    text-align:right;word-break:break-word;min-width:0;
  }

  .col-menu{min-width:0}

  /* Kartu Form Absensi */
  .card{
    background:var(--card);border-radius:16px;
    border:2px solid var(--border);
    box-shadow:0 0 0 1px rgba(96,165,250,.15),0 0 20px rgba(59,130,246,.15),0 8px 24px rgba(0,0,0,.4);
    padding:22px;margin-bottom:18px;
    transition:background .3s,border-color .3s,box-shadow .3s;
  }
  .card-title{
    font-size:15px;font-weight:800;color:var(--text);
    margin-bottom:16px;display:flex;align-items:center;gap:8px;
    padding-bottom:12px;border-bottom:1px dashed rgba(96,165,250,.25);
  }
  .card-title .emoji{font-size:19px}

  /* Form Elements */
  .form-group{margin-bottom:16px;}
  .form-group label{
    display:block;font-size:11px;font-weight:800;color:#93C5FD;
    text-transform:uppercase;letter-spacing:.05em;margin-bottom:6px;
  }
  body.light .form-group label{color:#1E40AF}
  .form-group input, .form-group select, .form-group textarea{
    width:100%;padding:12px 14px;
    background:var(--card-inner);color:var(--text);
    border:1.5px solid var(--border);border-radius:10px;
    font-family:inherit;font-size:14px;font-weight:600;
    outline:none;transition:border-color .2s,box-shadow .2s;
  }
  .form-group input:focus, .form-group select:focus, .form-group textarea:focus{
    border-color:var(--accent);
    box-shadow:0 0 0 3px rgba(96,165,250,.25);
  }
  .form-group input:disabled, .form-group select:disabled{
    opacity:0.6;cursor:not-allowed;background:rgba(0,0,0,0.1);
  }
  .form-group textarea{resize:vertical;min-height:80px;}

  /* Tombol Aksi Absen */
  .btn-action-group{
    display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:24px;
  }
  @media(max-width:480px){ .btn-action-group{grid-template-columns:1fr;} }
  
  .btn-absen{
    padding:16px;border-radius:12px;border:none;
    font-family:inherit;font-size:15px;font-weight:800;
    cursor:pointer;transition:all .22s;
    display:flex;align-items:center;justify-content:center;gap:8px;
    text-transform:uppercase;letter-spacing:.05em;
  }
  .btn-absen:hover:not(:disabled){transform:translateY(-2px);}
  .btn-absen:disabled{opacity:0.5;cursor:not-allowed;transform:none;}
  
  .btn-masuk{
    background:linear-gradient(135deg,#059669,#10B981);
    color:#fff;box-shadow:0 4px 14px rgba(16,185,129,.4);
  }
  .btn-masuk:hover:not(:disabled){box-shadow:0 8px 22px rgba(16,185,129,.55);}
  
  .btn-pulang{
    background:linear-gradient(135deg,#D97706,#F59E0B);
    color:#fff;box-shadow:0 4px 14px rgba(245,158,11,.4);
  }
  .btn-pulang:hover:not(:disabled){box-shadow:0 8px 22px rgba(245,158,11,.55);}

  .btn-simpan{
    background:linear-gradient(135deg,#1E40AF,#3B82F6);
    color:#fff;box-shadow:0 4px 14px rgba(59,130,246,.4);
    margin-top:16px;padding:16px;border-radius:12px;border:none;
    font-family:inherit;font-size:15px;font-weight:800;
    cursor:pointer;transition:all .22s;width:100%;
    display:flex;align-items:center;justify-content:center;gap:8px;
  }
  .btn-simpan:hover:not(:disabled){
    transform:translateY(-2px);box-shadow:0 8px 22px rgba(59,130,246,.55);
  }
  .btn-simpan:disabled{opacity:0.5;cursor:not-allowed;transform:none;}

  .form-header-inline{
    display:flex;align-items:center;justify-content:space-between;
    gap:12px;margin-bottom:14px;flex-wrap:wrap;
  }
  .form-header-inline .form-title-text{
    display:flex;align-items:center;gap:8px;
    font-size:16px;font-weight:800;
    color:var(--yellow);margin:0;
    text-shadow:0 0 12px rgba(252,211,77,.4);
  }
  body.light .form-header-inline .form-title-text{color:#D97706;text-shadow:0 0 10px rgba(217,119,6,.25)}
  .form-header-inline .form-title-text .emoji{font-size:20px}
  .form-header-inline .btn-back-inline{
    background:var(--card);color:var(--text);
    border:2px solid var(--border);
    padding:9px 18px;border-radius:10px;
    font-family:inherit;font-size:13px;font-weight:700;
    cursor:pointer;display:inline-flex;align-items:center;gap:6px;
    transition:all .2s;white-space:nowrap;
    text-decoration:none;
    box-shadow:0 0 0 1px rgba(96,165,250,.15),0 4px 12px rgba(0,0,0,.3);
  }
  a.btn-back-inline{color:var(--text)}
  a.btn-back-inline:visited{color:var(--text)}
  .form-header-inline .btn-back-inline:hover{
    background:linear-gradient(135deg,#1E3A8A,#3B82F6);
    border-color:var(--accent);color:#fff;
    transform:translateY(-2px);
    box-shadow:0 0 0 1px rgba(96,165,250,.5),0 0 20px rgba(59,130,246,.55),0 8px 20px rgba(59,130,246,.4);
  }

  .toast{
    position:fixed;bottom:24px;left:50%;
    transform:translateX(-50%) translateY(100px);
    background:#1E3A8A;color:#F1F5F9;
    padding:13px 24px;border-radius:12px;
    font-size:13.5px;font-weight:600;
    box-shadow:0 20px 40px rgba(0,0,0,.5), 0 0 20px rgba(96,165,250,.4);
    border:1px solid rgba(96,165,250,.5);
    opacity:0;transition:all .3s cubic-bezier(.34,1.56,.64,1);
    z-index:99999;max-width:calc(100vw - 32px);
  }
  .toast.show{transform:translateX(-50%) translateY(0);opacity:1}
  .toast.success{background:linear-gradient(135deg,#065F46,#047857)}
  .toast.error{background:linear-gradient(135deg,#7F1D1D,#B91C1C)}
  .toast.info{background:linear-gradient(135deg,#1E3A8A,#1D4ED8)}
  .toast.warn{background:linear-gradient(135deg,#78350F,#D97706)}

  .footer{
    text-align:center;padding:20px 12px;
    font-size:14px;color:var(--yellow);font-weight:700;
    text-shadow:0 0 10px rgba(252,211,77,.35);
  }
  body.light .footer{color:#D97706;text-shadow:0 0 8px rgba(217,119,6,.2)}
  .footer strong{color:var(--yellow);font-weight:900;font-size:15px}
  body.light .footer strong{color:#D97706}

  @media(max-width:900px){
    .wrapper{grid-template-columns:1fr;gap:18px}
    .col-profil{position:static;height:auto;max-height:none}
    .profile-card{max-height:none;height:auto}
    .profile-card-body{overflow-y:visible;max-height:none}
  }
  @media(max-width:640px){
    .header{flex-wrap:wrap;padding:12px 16px;position:relative}
    .header-left{flex:1 1 100%;text-align:center;justify-content:center}
    .header-center{flex:1 1 100%;order:2}
    .header-right{flex:1 1 100%;justify-content:center;order:3}
    .jam-box{font-size:11px;padding:6px 14px}
    .wrapper{padding:16px 12px}
    .card{padding:16px;}
    .form-header-inline{flex-direction:column;align-items:stretch}
    .form-header-inline .btn-back-inline{justify-content:center}
  }
</style>
</head>

<body>

<!-- ORNAMEN (Sederhana) -->
<div class="ornament" style="top:8%;left:3%;font-size:38px;color:#60A5FA;">♡</div>
<div class="ornament" style="top:45%;left:5%;font-size:30px;color:#93C5FD;animation-delay:1.5s;">❤</div>
<div class="ornament" style="bottom:12%;right:6%;font-size:34px;color:#3B82F6;animation-delay:2.5s;">♡</div>

<!-- HEADER -->
<div class="header">
  <div class="header-left">
    <h1 id="headerTitle">Halaman Absensi Guru</h1>
  </div>
  <div class="header-center">
    <div class="jam-box">
      <span class="jam-dot"></span>
      <span id="liveClock">Memuat...</span>
    </div>
  </div>
  <div class="header-right">
    <button class="logout" onclick="logout()">Keluar</button>
    <button class="theme-toggle" id="themeBtn" onclick="toggleTheme()" title="Ganti Tema">🌙</button>
  </div>
</div>

<!-- WRAPPER -->
<div class="wrapper">

  <!-- KOLOM KIRI: PROFIL GURU -->
  <div class="col-profil">
    <div class="profile-card">
      <div class="profile-card-header">
        <div class="profile-photo" id="profilePhoto">-</div>
        <h2 id="profileNama">-</h2>
        <div class="jabatan-badge" id="profileJabatan">-</div>
        <span class="lama-text" id="profileLama">-</span>
      </div>
      <div class="profile-card-body" id="profileBody">
        <!-- diisi JavaScript -->
      </div>
    </div>
  </div>

  <!-- KOLOM KANAN: KONTEN ABSENSI -->
  <div class="col-menu">

    <!-- JUDUL + TOMBOL KEMBALI INLINE -->
    <div class="form-header-inline">
      <div class="form-title-text">
        <span class="emoji">📝</span>
        <span>Form Absensi Harian</span>
      </div>
      <a class="btn-back-inline" href="../guru.html" title="Kembali ke halaman utama">
        ← Kembali ke Menu
      </a>
    </div>

    <!-- KARTU ABSENSI -->
    <div class="card">
      <div class="card-title">
        <span class="emoji">⏱️</span>
        <span id="absensiTitle">Absensi Hari Ini</span>
      </div>
      
      <form id="formAbsensi" onsubmit="simpanAbsensi(event)">
        
        <!-- Hidden Inputs -->
        <input type="hidden" id="inputNama" />
        <input type="hidden" id="inputJabatan" />
        <input type="hidden" id="inputRombel" />
        <input type="hidden" id="inputTanggal" />
        <input type="hidden" id="inputJamMasuk" />
        <input type="hidden" id="inputJamPulang" />

        <!-- Tanggal -->
        <div class="form-group">
          <label>Tanggal</label>
          <input type="text" id="displayTanggal" readonly style="background:rgba(0,0,0,0.2);cursor:not-allowed;" />
        </div>

        <!-- Status Kehadiran -->
        <div class="form-group">
          <label>Status Kehadiran</label>
          <select id="selectStatus" onchange="handleStatusChange()" required>
            <option value="">-- Pilih Status --</option>
            <option value="hadir">✅ Hadir</option>
            <option value="sakit">🤒 Sakit</option>
            <option value="izin">📝 Izin</option>
            <option value="cuti">🏖️ Cuti</option>
            <option value="alpa">❌ Alpa (Tanpa Keterangan)</option>
          </select>
        </div>

        <!-- Keterangan -->
        <div class="form-group" id="groupKeterangan" style="display:none;">
          <label>Keterangan Tambahan (Opsional)</label>
          <textarea id="inputKeterangan" placeholder="Contoh: Sakit demam, surat dokter terlampir..."></textarea>
        </div>

        <!-- Cuti Date Range -->
        <div id="groupCuti" style="display:none;">
          <div class="form-group">
            <label>Cuti Dari Tanggal</label>
            <input type="date" id="inputCutiDari" />
          </div>
          <div class="form-group">
            <label>Cuti Sampai Tanggal</label>
            <input type="date" id="inputCutiSampai" />
          </div>
        </div>

        <!-- Jam (Disembunyikan jika Alpa) -->
        <div id="groupJam" style="display:block;">
          <div class="form-group">
            <label>Jam Masuk</label>

<script>
/* ============================================================
   KONFIGURASI STORAGE

const STORAGE = {

  kelas: 'ra_kelas',
  absen: 'ra_absensi_guru'
};

/* ============================================================
   UTIL & HELPER
   ============================================================ */
const $ = (id) => document.getElementById(id);

function escapeHtml(s){
  if(s == null) return '';
  return String(s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

function normalisasiNama(nama){
  if(!nama) return '';
  let s = String(nama).trim().toLowerCase();
  s = s.split(',')[0].trim(); // Ambil nama depan sebelum gelar
  s = s.replace(/[.,']/g,' '); // Hapus tanda baca
  s = s.replace(/\s+/g,' ').trim(); // Normalisasi spasi
  return s;
}

function namaKeFile(nama){
  let b = String(nama||'').split(',')[0].trim();
  b = b.replace(/\s+/g,'-');
  b = b.replace(/[^a-zA-Z0-9\-]/g,'');
  return b;
}

function getWITA(){
  const now = new Date();
  const utc = now.getTime() + (now.getTimezoneOffset() * 60000);
  return new Date(utc + (8 * 3600000)); // UTC+8
}

function getTodayISO(){
  const w = getWITA();
  return w.getFullYear() + '-' +
    String(w.getMonth()+1).padStart(2,'0') + '-' +
    String(w.getDate()).padStart(2,'0');
}

const NAMA_BULAN_ID = ['Januari','Februari','Maret','April','Mei','Juni',
                       'Juli','Agustus','September','Oktober','November','Desember'];
const NAMA_HARI_ID  = ['Minggu','Senin','Selasa','Rabu','Kamis','Jumat','Sabtu'];

function fmtTanggal(iso){
  if(!iso) return '-';
  const d = new Date(iso + (iso.length === 10 ? 'T00:00:00' : ''));
  if(isNaN(d)) return iso;
  return d.getDate() + ' ' + NAMA_BULAN_ID[d.getMonth()] + ' ' + d.getFullYear();
}

function hitungLamaMengajar(tmt){
  if(!tmt) return { teks:'-', tahun:0, bulan:0 };
  const a = new Date(tmt + 'T00:00:00');
  const b = new Date();
  if(isNaN(a) || a > b) return { teks:'-', tahun:0, bulan:0 };
  let tahun = b.getFullYear() - a.getFullYear();
  let bulan = b.getMonth() - a.getMonth();
  if(bulan < 0){ tahun--; bulan += 12; }
  let teks = '';
  if(tahun > 0) teks += tahun + ' thn ';
  if(bulan > 0) teks += bulan + ' bln';
  if(!teks) teks = 'Baru';
  return { teks: teks.trim(), tahun, bulan };
}

/* ============================================================
   BEEP & TOAST
   ============================================================ */
function playBeep(type){
  try{
    const Ctx = window.AudioContext || window.webkitAudioContext;
    if(!Ctx) return;
    const ctx = new Ctx();
    const beep = (startAt, freq, dur, vol) => {
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'square';
      osc.frequency.setValueAtTime(freq, ctx.currentTime + startAt);
      gain.gain.setValueAtTime(0.0001, ctx.currentTime + startAt);
      gain.gain.exponentialRampToValueAtTime(vol || 0.55, ctx.currentTime + startAt + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + startAt + dur);
      osc.connect(gain).connect(ctx.destination);
      osc.start(ctx.currentTime + startAt);
      osc.stop(ctx.currentTime + startAt + dur + 0.02);
    };
    if(type === 'error'){
      beep(0.00, 180, 0.18, 0.55); beep(0.24, 180, 0.18, 0.55);
    } else if(type === 'warn'){
      beep(0.00, 440, 0.16, 0.5); beep(0.20, 440, 0.16, 0.5);
    } else if(type === 'success'){
      beep(0.00, 660, 0.10, 0.4); beep(0.14, 880, 0.14, 0.4);
    } else if(type === 'info'){
      beep(0.00, 520, 0.10, 0.35);
    }
    setTimeout(() => { try{ ctx.close(); }catch(e){} }, 1200);
  }catch(e){}
}

function showToast(msg, type){
  const t = document.getElementById('toast');
  if(!t) return;
  t.textContent = msg;
  t.className = 'toast show' + (type ? ' ' + type : '');
  clearTimeout(t._timer);
  t._timer = setTimeout(() => t.classList.remove('show'), 3200);
  if(type === 'error' || type === 'warn' || type === 'success'){
    playBeep(type);
  }
}

  localStorage.setItem('theme', next);

}

function updateClock(){
  const w = getWITA();
  const h = String(w.getHours()).padStart(2,'0');
  const m = String(w.getMinutes()).padStart(2,'0');
  const s = String(w.getSeconds()).padStart(2,'0');

    NAMA_BULAN_ID[w.getMonth()] + ' ' + w.getFullYear() + ' • ' + h + '.' + m + '.' + s + ' WITA';
}

/* ============================================================
   CARI DATA GURU DI SUPABASE
   ============================================================ */
let dataGuru = null;
let dataKelas = null;
let absenHariIni = null;

async function cariDataGuru(){
  const namaLogin = normalisasiNama(user.nama);
  if (typeof sb === 'undefined') return null;

  // 1. Cari di tabel guru
  let { data, error } = await sb.from('guru').select('*').ilike('nama', `%${namaLogin}%`).limit(1).maybeSingle();
  
  if(!data) {
    // Fallback: cari pakai nama depan saja
    const depan = namaLogin.split(' ')[0];
    if(depan.length > 2){
      let { data: data2 } = await sb.from('guru').select('*').ilike('nama', `%${depan}%`).limit(1).maybeSingle();
      if(data2) data = data2;
    }
  }

  // 2. Cari di tabel tendik jika tidak ada di guru
  if(!data) {
    let { data: dataTendik } = await sb.from('tendik').select('*').ilike('nama', `%${namaLogin}%`).limit(1).maybeSingle();
    if(dataTendik) {
      data = { ...dataTendik, _sumber: 'tendik', jabatan: dataTendik.jabatan || 'Tenaga Kependidikan' };
    }
  }

  return data;
}

async function cariKelasGuru(guruId){
  if (!guruId || typeof sb === 'undefined') return null;
  const { data, error } = await sb.from('kelas').select('*');
  if(error || !data) return null;

  return data.find(k => k.guru_utama_id === guruId || (k.guru_pendamping_ids && k.guru_pendamping_ids.includes(guruId)));
}

async function cekAbsenHariIni(namaGuru, tanggal){
  if (typeof sb === 'undefined') return null;
  const { data, error } = await sb.from('absensi')
    .select('*')
    .eq('tanggal', tanggal)
    .ilike('nama_guru', `%${normalisasiNama(namaGuru)}%`)
    .limit(1)
    .maybeSingle();
  
  if(error) {
    console.error("Cek absen error:", error);
    return null;
  }
  return data;
}

/* ============================================================
   AVATAR SVG
   ============================================================ */
function avatarSvg(nama, warnaAksen){
  let hash = 0;
  for(let i=0; i<(nama||'').length; i++) hash += nama.charCodeAt(i);
  const variant = Math.abs(hash) % 4;
  const palettes = [
    { bg1:'#1E3A8A', bg2:'#3D1A1A', fg:'#F5F5F5', accent:'#EF4444' },
    { bg1:'#1E40AF', bg2:'#1A2A3D', fg:'#F5F5F5', accent:'#60A5FA' },
    { bg1:'#0C4A6E', bg2:'#3D2A1A', fg:'#F5F5F5', accent:'#FBBF24' },
    { bg1:'#312E81', bg2:'#2A1A3D', fg:'#F5F5F5', accent:'#C4B5FD' }
  ];
  const p = palettes[variant];
  const accent = warnaAksen || p.accent;
  const id = 'av' + Math.random().toString(36).slice(2, 9);
  
  // Bentuk sederhana untuk avatar
  const shapes = [
    `<circle cx="60" cy="42" r="18" fill="url(#g${id})"/>
     <path d="M 20 100 Q 20 68 60 68 Q 100 68 100 100 Z" fill="url(#g${id})"/>`,
    `<circle cx="60" cy="40" r="17" fill="url(#g${id})"/>
     <path d="M 22 100 Q 22 70 60 70 Q 98 70 98 100 Z" fill="url(#g${id})"/>`,
    `<path d="M 60 22 Q 82 22 82 48 Q 82 62 78 66 L 78 78 L 42 78 L 42 66 Q 38 62 38 48 Q 38 22 60 22 Z" fill="url(#g${id})"/>
     <circle cx="60" cy="46" r="12" fill="${p.bg1}" opacity="0.4"/>
     <path d="M 22 100 Q 22 78 60 78 Q 98 78 98 100 Z" fill="url(#g${id})"/>`,
    `<circle cx="60" cy="44" r="16" fill="url(#g${id})"/>
     <rect x="42" y="26" width="36" height="10" rx="4" fill="${accent}" opacity="0.7"/>
     <path d="M 22 100 Q 22 72 60 72 Q 98 72 98 100 Z" fill="url(#g${id})"/>`
  ];
  
  return `<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid slice">
    <defs>
      <linearGradient id="g${id}" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="${p.fg}" stop-opacity="0.95"/>
        <stop offset="100%" stop-color="${p.fg}" stop-opacity="0.75"/>
      </linearGradient>
      <linearGradient id="bg${id}" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="${p.bg1}"/>
        <stop offset="100%" stop-color="${p.bg2}"/>
      </linearGradient>
    </defs>
    <rect width="120" height="120" fill="url(#bg${id})"/>
    ${shapes[variant]}
  </svg>`;
}

function pakaiFotoAtauAvatar(el, nama){
  if(!el) return;
  const fotoUpload = localStorage.getItem('ra_foto_' + nama);
  if(fotoUpload){ el.innerHTML = '<img src="' + fotoUpload + '" alt="Foto">'; return; }
  const baseName = namaKeFile(nama);
  const exts = ['jpg','png','jpeg','JPG','PNG'];
  let idx = 0;
  function coba(){
    if(idx >= exts.length){ el.innerHTML = avatarSvg(nama); return; }
    const img = new Image();
    img.onload = function(){ el.innerHTML = '<img src="' + img.src + '" alt="Foto">'; };
    img.onerror = function(){ idx++; coba(); };
    img.src = '../foto/' + baseName + '.' + exts[idx];
  }
  coba();
}

/* ============================================================
   RENDER PROFIL GURU
   ============================================================ */
async function renderProfil(){
  const body = document.getElementById('profileBody');
  const nama = user.nama;
  if(!body) return;

  dataGuru = await cariDataGuru();
  
  // Update Header Title
  const headerTitle = document.getElementById('headerTitle');
  if(headerTitle) headerTitle.textContent = 'Absensi — ' + (nama.split(',')[0] || nama);

  if(!dataGuru){
    document.getElementById('profileNama').textContent = nama;
    document.getElementById('profileJabatan').textContent = 'Guru';
    document.getElementById('profileLama').textContent = '';
    body.innerHTML = `
      <div class="info-section-title">📇 Identitas</div>
      <div class="info-list">
        <div class="info-item"><span class="lbl">Nama</span><span class="val">${escapeHtml(nama)}</span></div>
        <div class="info-item"><span class="lbl">Peran</span><span class="val">Guru</span></div>
      </div>
      <div class="info-section-title" style="margin-top:14px; color:#F87171;">⚠️ Info</div>
      <p style="font-size:11px; color:var(--sub); line-height:1.4;">Data profil belum ditemukan di database. Pastikan nama Anda terdaftar di menu Admin.</p>
    `;
    pakaiFotoAtauAvatar(document.getElementById('profilePhoto'), nama);
    // Isi hidden input minimal
    $('inputNama').value = nama;
    $('inputJabatan').value = 'Guru';
    return;
  }

  // Update Tampilan Profil
  document.getElementById('profileNama').textContent = dataGuru.nama;
  document.getElementById('profileJabatan').textContent = dataGuru.jabatan || 'Guru';
  const lama = hitungLamaMengajar(dataGuru.tmt);
  document.getElementById('profileLama').textContent = dataGuru.tmt ? '⏱️ ' + lama.teks : '';

  let html = '';
  
  // Identitas
  const ident = [];
  if(dataGuru.nip) ident.push({l:'NIP', v:dataGuru.nip});
  if(dataGuru.npk) ident.push({l:'NPK', v:dataGuru.npk});
  if(dataGuru.jk) ident.push({l:'Jenis Kelamin', v: dataGuru.jk === 'L' ? 'Laki-laki' : 'Perempuan' });
  if(ident.length){
    html += '<div class="info-section-title">📇 Identitas</div><div class="info-list">';
    ident.forEach(it => {
      html += `<div class="info-item"><span class="lbl">${escapeHtml(it.l)}</span><span class="val">${escapeHtml(it.v)}</span></div>`;
    });
    html += '</div>';
  }

  // Kepegawaian
  const peg = [];
  if(dataGuru.pendidikan) peg.push({l:'Pendidikan', v:dataGuru.pendidikan});
  if(dataGuru.tmt) peg.push({l:'TMT', v:fmtTanggal(dataGuru.tmt)});
  if(dataGuru.jabatan) peg.push({l:'Jabatan', v:dataGuru.jabatan});
  
  // Rombel
  dataKelas = await cariKelasGuru(dataGuru.id);
  if(dataKelas) {
    const namaRombel = dataKelas.nama || dataKelas.rombel || '-';
    peg.push({l:'Rombel', v:namaRombel});
    $('inputRombel').value = namaRombel;
  } else {
    $('inputRombel').value = '—';
  }

  if(peg.length){
    html += '<div class="info-section-title">💼 Kepegawaian</div><div class="info-list">';
    peg.forEach(it => {
      html += `<div class="info-item"><span class="lbl">${escapeHtml(it.l)}</span><span class="val">${escapeHtml(it.v)}</span></div>`;
    });
    html += '</div>';
  }

  // Kontak
  const kontak = [];
  if(dataGuru.hp) kontak.push({l:'HP/WA', v:dataGuru.hp});
  if(kontak.length){
    html += '<div class="info-section-title">📞 Kontak</div><div class="info-list">';
    kontak.forEach(it => {
      html += `<div class="info-item"><span class="lbl">${escapeHtml(it.l)}</span><span class="val">${escapeHtml(it.v)}</span></div>`;
    });
    html += '</div>';
  }

  body.innerHTML = html;
  pakaiFotoAtauAvatar(document.getElementById('profilePhoto'), dataGuru.nama);

  // Isi Hidden Inputs
  $('inputNama').value = dataGuru.nama;
  $('inputJabatan').value = dataGuru.jabatan || 'Guru';
}

/* ============================================================
   CEK STATUS ABSENSI HARI INI (KUNCI FORM)
   ============================================================ */
async function cekStatusHariIni(){
  const tgl = getTodayISO();
  const namaGuru = dataGuru ? dataGuru.nama : user.nama;
  
  // Tampilkan Tanggal
  $('displayTanggal').value = fmtTanggal(tgl) + ' (' + NAMA_HARI_ID[getWITA().getDay()] + ')';
  $('inputTanggal').value = tgl;

  absenHariIni = await cekAbsenHariIni(namaGuru, tgl);

  if(absenHariIni){
    // Sudah pernah absen hari ini
    showToast('✅ Anda sudah mengisi absensi hari ini.', 'info');
    
    // Kunci Form
    $('selectStatus').value = absenHariIni.status || 'hadir';
    $('selectStatus').disabled = true;
    
    if(absenHariIni.keterangan) {
      $('inputKeterangan').value = absenHariIni.keterangan;
      $('groupKeterangan').style.display = 'block';
      $('inputKeterangan').disabled = true;
    }

    if(absenHariIni.status === 'cuti') {
      $('inputCutiDari').value = absenHariIni.cuti_dari || '';
      $('inputCutiSampai').value = absenHariIni.cuti_sampai || '';
      $('groupCuti').style.display = 'block';
      $('inputCutiDari').disabled = true;
      $('inputCutiSampai').disabled = true;
    }

    // Set Jam
    if(absenHariIni.jam_masuk) {
      $('displayJamMasuk').value = absenHariIni.jam_masuk;
      $('inputJamMasuk').value = absenHariIni.jam_masuk;
    }
    if(absenHariIni.jam_pulang) {
      $('displayJamPulang').value = absenHariIni.jam_pulang;
      $('inputJamPulang').value = absenHariIni.jam_pulang;
    }

    // Sembunyikan tombol masuk/pulang & tombol simpan
    if(absenHariIni.status === 'alpa') {
      $('groupJam').style.display = 'none';
    } else {
      $('btnMasuk').disabled = true;
      $('btnPulang').disabled = true;
    }
    
    $('btnSimpan').style.display = 'none';
    
    // Update Judul
    $('absensiTitle').textContent = 'Absensi Hari Ini (Terkunci)';
    $('absensiTitle').style.color = 'var(--success)';
    return;
  }

  // Belum absen, cek apakah sudah lewat jam 12:00 (Auto Alpa)
  const jamSekarang = getWITA().getHours();
  if(jamSekarang >= 12) {
    $('selectStatus').value = 'alpa';
    $('selectStatus').disabled = true;
    $('groupJam').style.display = 'none';
    $('inputKeterangan').value = 'Auto-Alpa: Melewati batas jam 12:00 WITA.';
    $('groupKeterangan').style.display = 'block';
    $('inputKeterangan').disabled = true;
    showToast('⚠️ Anda melewati batas absen. Status dikunci sebagai ALPA.', 'warn');
    
    // Tetap izinkan simpan
    $('btnSimpan').disabled = false;
    return;
  }

  // Jika hari Minggu (Libur)
  if(getWITA().getDay() === 0) {
    showToast('🎉 Hari Minggu adalah hari libur. Tidak perlu absen.', 'info');
    $('selectStatus').disabled = true;
    $('btnSimpan').disabled = true;
    $('btnMasuk').disabled = true;
    $('btnPulang').disabled = true;
  }
}
</script>

<script>
/* ============================================================
   STATE GLOBAL ABSENSI
   ============================================================ */
let stateAbsen = {
  sudahMasuk: false,
  sudahPulang: false,
  jamMasuk: null,
  jamPulang: null
};

/* ============================================================
   HANDLER: PERUBAHAN STATUS KEHADIRAN
   ============================================================ */
function handleStatusChange(){
  const status = $('selectStatus').value;
  
  // Reset form dulu
  $('groupKeterangan').style.display = 'none';
  $('groupCuti').style.display = 'none';
  $('groupJam').style.display = 'block';
  $('btnSimpan').disabled = true;

  // Reset tombol
  $('btnMasuk').disabled = false;
  $('btnPulang').disabled = true;
  $('displayJamMasuk').value = '';
  $('displayJamPulang').value = '';
  $('inputJamMasuk').value = '';
  $('inputJamPulang').value = '';
  stateAbsen = { sudahMasuk:false, sudahPulang:false, jamMasuk:null, jamPulang:null };

  if(!status) return;

  if(status === 'hadir'){
    $('groupJam').style.display = 'block';
    showToast('Silakan klik tombol "Absen Masuk" terlebih dahulu.', 'info');
  
  } else if(status === 'alpa'){
    // Sembunyikan jam, tampilkan tombol simpan
    $('groupJam').style.display = 'none';
    $('btnSimpan').disabled = false;
    $('btnMasuk').disabled = true;
    $('btnPulang').disabled = true;
    $('inputKeterangan').value = 'Alpa: Tidak hadir tanpa keterangan.';
    $('groupKeterangan').style.display = 'block';
    showToast('⚠️ Status ALPA dipilih. Klik Simpan untuk melanjutkan.', 'warn');
  
  } else if(status === 'sakit' || status === 'izin'){
    // Sembunyikan jam, tampilkan keterangan
    $('groupJam').style.display = 'none';
    $('groupKeterangan').style.display = 'block';
    $('btnSimpan').disabled = false;
    $('btnMasuk').disabled = true;
    $('btnPulang').disabled = true;
    showToast('Silakan isi keterangan, lalu klik Simpan.', 'info');
  
  } else if(status === 'cuti'){
    // Sembunyikan jam, tampilkan rentang cuti & keterangan
    $('groupJam').style.display = 'none';
    $('groupKeterangan').style.display = 'block';
    $('groupCuti').style.display = 'block';
    $('btnSimpan').disabled = false;
    $('btnMasuk').disabled = true;
    $('btnPulang').disabled = true;
    
    // Default tanggal cuti
    const tgl = getTodayISO();
    if(!$('inputCutiDari').value) $('inputCutiDari').value = tgl;
    if(!$('inputCutiSampai').value) $('inputCutiSampai').value = tgl;
    showToast('Silakan isi periode cuti, lalu klik Simpan.', 'info');
  }
}

/* ============================================================
   HANDLER: TOMBOL ABSEN MASUK
   ============================================================ */
function absenMasuk(){
  if(stateAbsen.sudahMasuk){
    showToast('Anda sudah absen masuk hari ini.', 'warn');
    return;
  }

  const status = $('selectStatus').value;
  if(status !== 'hadir'){
    showToast('Tombol Absen Masuk hanya untuk status "Hadir".', 'warn');
    return;
  }

  // Ambil jam WITA sekarang
  const w = getWITA();
  const jam = String(w.getHours()).padStart(2,'0') + ':' + String(w.getMinutes()).padStart(2,'0');
  
  // Freeze jam
  stateAbsen.sudahMasuk = true;
  stateAbsen.jamMasuk = jam;
  
  $('displayJamMasuk').value = jam + ' WITA';
  $('inputJamMasuk').value = jam;
  
  // Kunci tombol Masuk, aktifkan tombol Pulang
  $('btnMasuk').disabled = true;
  $('btnPulang').disabled = false;
  
  showToast('✅ Absen Masuk tercatat pada ' + jam + ' WITA', 'success');
}

/* ============================================================
   HANDLER: TOMBOL ABSEN PULANG
   ============================================================ */
function absenPulang(){
  if(!stateAbsen.sudahMasuk){
    showToast('Silakan klik "Absen Masuk" terlebih dahulu.', 'error');
    return;
  }
  if(stateAbsen.sudahPulang){
    showToast('Anda sudah absen pulang.', 'warn');
    return;
  }

  const w = getWITA();
  const jam = String(w.getHours()).padStart(2,'0') + ':' + String(w.getMinutes()).padStart(2,'0');
  
  stateAbsen.sudahPulang = true;
  stateAbsen.jamPulang = jam;
  
  $('displayJamPulang').value = jam + ' WITA';
  $('inputJamPulang').value = jam;
  
  // Kunci tombol Pulang, aktifkan tombol Simpan
  $('btnPulang').disabled = true;
  $('btnSimpan').disabled = false;
  
  showToast('✅ Absen Pulang tercatat pada ' + jam + ' WITA. Silakan klik Simpan.', 'success');
}

/* ============================================================
   VALIDASI FORM SEBELUM SIMPAN
   ============================================================ */
function validasiForm(){
  const status = $('selectStatus').value;
  if(!status){
    showToast('❌ Pilih status kehadiran terlebih dahulu.', 'error');
    return false;
  }

  if(status === 'hadir'){
    if(!stateAbsen.sudahMasuk){
      showToast('❌ Klik "Absen Masuk" terlebih dahulu.', 'error');
      return false;
    }
  }

  if(status === 'cuti'){
    const dari = $('inputCutiDari').value;
    const sampai = $('inputCutiSampai').value;
    if(!dari || !sampai){
      showToast('❌ Isi tanggal mulai dan selesai cuti.', 'error');
      return false;
    }
    if(dari > sampai){
      showToast('❌ Tanggal mulai cuti tidak boleh melebihi tanggal selesai.', 'error');
      return false;
    }
  }

  return true;
}

/* ============================================================
   HANDLER: SIMPAN ABSENSI KE SUPABASE
   ============================================================ */
async function simpanAbsensi(e){
  e.preventDefault();
  
  if(!validasiForm()) return;
  if (typeof sb === 'undefined') {
    showToast('❌ Koneksi database terputus.', 'error');
    return;
  }

  const btn = $('btnSimpan');
  btn.disabled = true;
  const originalText = btn.textContent;
  btn.textContent = '⏳ Menyimpan...';

  try {
    const status = $('selectStatus').value;
    const namaGuru = $('inputNama').value || (dataGuru ? dataGuru.nama : user.nama);
    const tanggal = $('inputTanggal').value || getTodayISO();
    const rombel = $('inputRombel').value || '—';
    const jabatan = $('inputJabatan').value || 'Guru';
    
    // Siapkan record sesuai struktur tabel absensi
    const record = {
      nama_guru: namaGuru,
      tanggal: tanggal,
      jam_masuk: stateAbsen.jamMasuk || null,
      jam_pulang: stateAbsen.jamPulang || null,
      status: status,
      rombel: rombel,
      keterangan: $('inputKeterangan').value || '',
      catatan: '',
      cuti_dari: status === 'cuti' ? $('inputCutiDari').value : null,
      cuti_sampai: status === 'cuti' ? $('inputCutiSampai').value : null,
      guru_jabatan: jabatan
    };

    let result;
    if(absenHariIni && absenHariIni.id){
      // Jika sudah ada, update (misal: awalnya belum pulang, sekarang pulang)
      result = await sb.from('absensi').update(record).eq('id', absenHariIni.id);
    } else {
      // Insert baru
      result = await sb.from('absensi').insert([record]);
    }

    if(result.error){
      console.error('Simpan error:', result.error);
      showToast('❌ Gagal menyimpan: ' + result.error.message, 'error');
      btn.disabled = false;
      btn.textContent = originalText;
      return;
    }

    // Sukses
    showToast('🎉 Absensi berhasil disimpan!', 'success');
    playBeep('success');
    
    // Kunci form
    $('selectStatus').disabled = true;
    $('inputKeterangan').disabled = true;
    $('inputCutiDari').disabled = true;
    $('inputCutiSampai').disabled = true;
    $('btnMasuk').disabled = true;
    $('btnPulang').disabled = true;
    
    btn.style.display = 'none';
    $('absensiTitle').textContent = 'Absensi Hari Ini (Tersimpan)';
    $('absensiTitle').style.color = 'var(--success)';
    
    // Update cache lokal
    absenHariIni = record;

    // Sinkronkan ke localStorage sebagai cache (opsional)
    try {
      const cache = JSON.parse(localStorage.getItem(STORAGE.absen) || '[]');
      cache.push(record);
      localStorage.setItem(STORAGE.absen, JSON.stringify(cache));
    } catch(err){}

  } catch(err){
    console.error(err);
    showToast('❌ Terjadi kesalahan sistem: ' + err.message, 'error');
    btn.disabled = false;
    btn.textContent = originalText;
  }
}

/* ============================================================
   LOGOUT
   ============================================================ */
function logout(){
  if(confirm('Yakin ingin keluar?')){
    localStorage.removeItem('user');
    window.location.href = '../index.html';
  }
}

/* ============================================================
   MODAL KONFIRMASI (Opsional)
   ============================================================ */
function tutupKonfirmasi(){
  const el = document.getElementById('modalKonfirmasi');
  if(el) el.style.display = 'none';
}

/* ============================================================
   INIT — Jalankan Saat Halaman Dimuat
   ============================================================ */
async function init(){
  try {
    // 1. Render profil guru (ambil data dari Supabase)
    await renderProfil();
  } catch(e) {
    console.error('Gagal render profil:', e);
    showToast('⚠️ Gagal memuat profil. Cek koneksi.', 'warn');
  }

  try {
    // 2. Cek status absensi hari ini
    await cekStatusHariIni();
  } catch(e) {
    console.error('Gagal cek status absensi:', e);
    showToast('⚠️ Gagal memeriksa status absensi.', 'warn');
  }

  // 3. Siapkan form
  $('inputTanggal').value = getTodayISO();
  $('displayTanggal').value = fmtTanggal(getTodayISO()) + ' (' + NAMA_HARI_ID[getWITA().getDay()] + ')';
  $('btnSimpan').disabled = true;

  console.log('✅ absensi.html loaded — SIAGRA v.2.s (Supabase Ready)');
}
